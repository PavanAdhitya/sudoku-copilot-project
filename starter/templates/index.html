<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <h1>Sudoku Game</h1>
      <p class="app-subtitle">A polished puzzle board that adapts smoothly to desktop and mobile screens.</p>
    </header>
    <div id="sudoku-board"></div>
    <div class="controls">
      <label for="difficulty-select">Difficulty</label>
      <select id="difficulty-select">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
      <button id="theme-toggle">Dark mode</button>
      <button id="new-game">New Game</button>
      <button id="check-puzzle">Check Puzzle</button>
      <button id="check-solution">Check Solution</button>
      <button id="hint">Hint</button>
      <span id="timer">00:00</span>
      <span id="message"></span>
    </div>
    <section id="leaderboard-section" class="leaderboard-section">
      <h2>Top 10 Leaderboard</h2>
      <div id="leaderboard"></div>
    </section>
  </main>
  <script src="/static/main.js"></script>
</body>
</html>
